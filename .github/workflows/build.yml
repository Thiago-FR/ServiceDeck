name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: bump
        run: |
          git fetch --tags
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"
          new_tag="v${major}.${minor}.$((patch + 1))"

          echo "Última tag: $latest"
          echo "Nova tag: $new_tag"

          git tag "$new_tag"
          git push origin "$new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: tag
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-22.04
    env:
      VERSION_TAG: ${{ needs.tag.outputs.new_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libegl1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Linux executable
        run: pyinstaller ServiceDeck.spec

      - name: Package as tar.gz
        run: tar -czf ServiceDeck-linux.tar.gz -C dist ServiceDeck

      - name: Build .deb package
        run: |
          VERSION="${VERSION_TAG#v}"
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/usr/lib/servicedeck
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps

          cp -r dist/ServiceDeck/* deb_pkg/usr/lib/servicedeck/
          cp app/assets/icon.png deb_pkg/usr/share/icons/hicolor/256x256/apps/servicedeck.png

          cat > deb_pkg/usr/share/applications/servicedeck.desktop << EOF
          [Desktop Entry]
          Version=1.0
          Name=ServiceDeck
          Comment=Gerenciador de Microserviços
          Type=Application
          Terminal=false
          Exec=/usr/lib/servicedeck/ServiceDeck
          Icon=servicedeck
          Categories=Development;Utility;
          EOF

          cat > deb_pkg/DEBIAN/control << EOF
          Package: servicedeck
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Thiago <thiago_ssfr@hotmail.com>
          Description: Gerenciador de microserviços
           Permite iniciar, monitorar e abrir no editor todos os seus serviços a partir de um único lugar.
          EOF

          cat > deb_pkg/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          update-icon-caches /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          EOF
          chmod 0755 deb_pkg/DEBIAN/postinst

          cat > deb_pkg/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          update-icon-caches /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          EOF
          chmod 0755 deb_pkg/DEBIAN/postrm

          dpkg-deb --build --root-owner-group deb_pkg ServiceDeck.deb

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          files: |
            ServiceDeck-linux.tar.gz
            ServiceDeck.deb

  build-windows:
    needs: tag
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: windows-latest
    env:
      VERSION_TAG: ${{ needs.tag.outputs.new_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Convert icon PNG to ICO
        run: |
          pip install Pillow
          python -c "from PIL import Image; img = Image.open('app/assets/icon.png'); img.save('app/assets/icon.ico')"

      - name: Build Windows executable
        run: pyinstaller ServiceDeck_windows.spec

      - name: Package as zip
        run: Compress-Archive -Path dist\ServiceDeck\* -DestinationPath ServiceDeck-windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          files: ServiceDeck-windows.zip
