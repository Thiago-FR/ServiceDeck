name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libglib2.0-0 libegl1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Linux executable
        run: pyinstaller ServiceDeck.spec

      - name: Package as tar.gz
        run: tar -czf ServiceDeck-linux.tar.gz -C dist ServiceDeck

      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/usr/lib/servicedeck
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps

          cp -r dist/ServiceDeck/* deb_pkg/usr/lib/servicedeck/
          cp app/assets/icon.png deb_pkg/usr/share/icons/hicolor/256x256/apps/servicedeck.png

          cat > deb_pkg/usr/share/applications/servicedeck.desktop << EOF
          [Desktop Entry]
          Version=1.0
          Name=ServiceDeck
          Comment=Gerenciador de Microserviços
          Type=Application
          Terminal=false
          Exec=/usr/lib/servicedeck/ServiceDeck
          Icon=servicedeck
          Categories=Development;Utility;
          EOF

          cat > deb_pkg/DEBIAN/control << EOF
          Package: servicedeck
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Thiago <thiago.rose@conexasaude.com.br>
          Description: Gerenciador de microserviços
           Permite iniciar, monitorar e abrir no editor todos os seus serviços a partir de um único lugar.
          EOF

          cat > deb_pkg/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          update-icon-caches /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          EOF
          chmod 0755 deb_pkg/DEBIAN/postinst

          cat > deb_pkg/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          update-icon-caches /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          EOF
          chmod 0755 deb_pkg/DEBIAN/postrm

          dpkg-deb --build --root-owner-group deb_pkg ServiceDeck.deb

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ServiceDeck-linux.tar.gz
            ServiceDeck.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Convert icon PNG to ICO
        run: |
          pip install Pillow
          python -c "from PIL import Image; img = Image.open('app/assets/icon.png'); img.save('app/assets/icon.ico')"

      - name: Build Windows executable
        run: pyinstaller ServiceDeck_windows.spec

      - name: Package as zip
        run: Compress-Archive -Path dist\ServiceDeck\* -DestinationPath ServiceDeck-windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ServiceDeck-windows.zip
